#Build a feature branch or the develop branch, upload the artifact to a repository and update the GitOps repository.

name: Build feature/develop branch

# if: github.ref == 'refs/heads/develop'

#Trigger the workflow on-push and manually.
on:
  push:
    branches: 
    #- '**'
    - develop
    - "feature/**"
  workflow_dispatch:
    inputs:
      #Input to select the action.
      INPUT_ACTION:
        description: 'Select action'
        required: true
        default: build-and-deploy
        type: choice
        options:
          - build
          - build-and-deploy

#Global environment variables.
env:
  INPUT_ACTION: ${{ github.event.inputs.INPUT_ACTION }}
  VERSION_FILE: package.json
  AWS_REGION: us-east-1
  AWS_USERNAME: AWS
  ECR_REPOSITORY_URL: public.ecr.aws/l4a5c1v5
  ECR_REPOSITORY_GROUP: qba
  ECR_REPOSITORY_NAME: qba-back-end
  DEV_ENVIRONMENT_VALUES_FILE: environments/dev/values.yaml
  DEV_ENVIRONMENT_ENV_FILE: environments/dev/qba-back-end-env.yaml
  DEPLOYMENT_REPOSITORY: Ranuldeepanayake/qba-helm

#Permissions.
permissions:
  contents: write

jobs:
  build-feature-branch:

    #Runner label.
    runs-on: self-hosted

    #Checkout branch which is being built.
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

      #Check if the version number is in the correct format.
    - name: Validate version number
      run: |
        echo "Version file: ${VERSION_FILE}"

        #Read the version file.
        VERSION_NUMBER=$(jq -r '.version' ${VERSION_FILE} | tr -d '\n')

        #If node is installed in the runtime environment.
        #VERSION_NUMBER=$(node -p "require('./package.json').version") 
        
        #Append the version number variable to the array of runtime variables.
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
        echo "Version number: ${VERSION_NUMBER}"
        
        #Allowed patterns.
        PATTERN="([0-9]+\.[0-9]+\.[0]){1,1}"

        if [[ ! ${VERSION_NUMBER} =~ $PATTERN ]]; then
          echo "❌ Version number ${VERSION_NUMBER} is inconsistent with the format. Exiting!"
          echo "Allowed formats: x.x.0"
          exit 1
        else
          echo "✅ Version number ${VERSION_NUMBER} is consistent with the format"
        fi

      #Prepare the image tag with the necessary appends.
    - name: Prepare image tag
      id: meta
      run: | 
        #Append the time stamp variable to the array of runtime variables.
        BUILD_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
        echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> $GITHUB_ENV
        echo "Build timestamp: ${BUILD_TIMESTAMP}"

        #Append the commit digest.
        DIGEST_SHA=COMMITSHA_$(echo "${GITHUB_SHA}" | cut -c1-8)
        echo "DIGEST_SHA=$DIGEST_SHA" >> $GITHUB_ENV
        echo "Digest (SHA): ${DIGEST_SHA}"

        #Append the final tag to the array of runtime variables.
        IMAGE_TAG=${VERSION_NUMBER}-SNAPSHOT-${BUILD_TIMESTAMP}-${DIGEST_SHA}
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        echo "Image tag: ${IMAGE_TAG}"

      #Configure the artifact repository credentials.
    - name: Configure artifact repository credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

      #Only needed to log in to private ECR repositories.
      # - name: Login to Amazon ECR
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2

      #Log in to the artifact repository.
    - name: Login to the artifact repository
      run: |
        aws ecr-public get-login-password --region ${AWS_REGION} | docker login --username ${AWS_USERNAME} --password-stdin ${ECR_REPOSITORY_URL}

      #Build the image.
    - name: Build image
      run: |
        echo "Image name: ${ECR_REPOSITORY_URL}/${ECR_REPOSITORY_GROUP}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"
        docker build -t ${ECR_REPOSITORY_URL}/${ECR_REPOSITORY_GROUP}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG} .

      #Push the built image to an artifact repository.
    - name: Push image to artifact repository
      run: |
        docker push ${ECR_REPOSITORY_URL}/${ECR_REPOSITORY_GROUP}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}

    #Deployment. The .env file must be copied to the deployment repository regardless whether the file is deployed or not.

    #Checkout the gitops repository.
    - name: Checkout code
      #if: ${{ env.INPUT_ACTION == 'build-and-deploy' }}
      uses: actions/checkout@v4
      with:
          repository: ${{ env.DEPLOYMENT_REPOSITORY }}
          token: ${{ secrets.DEPLOYMENT_REPOSITORY_TOKEN }}
          path: other-repo
          #Cleans the workspace before checking out code.
          clean: true
          fetch-depth: 0   #Required to push back

      #Copy environment variables to the deployment repository.
    - name: Copy the .env file
      #if: ${{ env.INPUT_ACTION == 'build-and-deploy' }}
      run: |
        cp .env/.env-dev other-repo/${DEV_ENVIRONMENT_ENV_FILE}
        cd other-repo

        #Verify the change.
        if [[ -f "other-repo/${DEV_ENVIRONMENT_ENV_FILE}" ]]; then
          echo "✅ .env file exists"
        else
          echo "❌ .env file does not exist!"
          exit 1
        fi

    #Change the image tag. Only if the deploy option is selected.
    - name: Change the image tag
      if: ${{ env.INPUT_ACTION == 'build-and-deploy' }}
      uses: mikefarah/yq@v4.44.1
      with:
        cmd: |
          cd other-repo
          #yq -i '.image.tag = "${{ inputs.image_tag }}"' environments/prod/values.yaml
          #yq e -i '.containers.name.tag = strenv(IMAGE_TAG)' "${DEV_ENVIRONMENT_VALUES_FILE}"
          yq -i '(.containers[] | select(.name == "back-end") | .tag) = env(IMAGE_TAG)' "${DEV_ENVIRONMENT_VALUES_FILE}"

          #Verify the change.
          TAG_READ_BACK=$(yq '.containers[] | select(.name == "back-end") | .tag' "${DEV_ENVIRONMENT_VALUES_FILE}")
          echo "Tag read back: $TAG_READ_BACK"

    #Commit and push the change to the deployment repository.
    - name: Commit and push
      if: ${{ env.INPUT_ACTION == 'build-and-deploy' }}
      run: |
        cd other-repo

        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add ${DEV_ENVIRONMENT_VALUES_FILE};
        git add ${DEV_ENVIRONMENT_ENV_FILE};
        git commit -m "Pipeline (helm): replaced the image tag with ${IMAGE_TAG} and the .env file" || echo "No changes to commit"

        git push

