name: Build feature/develop branch

on:
  #Execute on push and manually.
  #push:
    #Only build automatically if pushed to the specified branches.
    branches: 
    #- '**'
    #- develop
    #- main
  workflow_dispatch:

env:
  VERSION_FILE: package.json

jobs:
  build-feature-branch:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION }}

    #Only needed to log in to private ECR repositories.
    # - name: Login to Amazon ECR
    #   id: login-ecr
    #   uses: aws-actions/amazon-ecr-login@v2

    - name: Login to Amazon Public ECR
      run: |
        aws ecr-public get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REPOSITORY_URL }}


      #Read the version file.
      #VERSION=$(node -p "require('./package.json').version")
      #Append the version number variable to the array of github runner variables.
      #echo "VERSION=$VERSION" >> $GITHUB_ENV 
      #Append the image digest.
      #SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
    - name: Prepare image tag with version number and timestamp
      id: meta
      run: | 
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        #VERSION=$(node -p "require('./package.json').version") #If node is installed in the environment.
        VERSION=$(jq -r '.version' $VERSION_FILE | tr -d '\n')
        echo "VERSION=$VERSION" >> $GITHUB_ENV 

        TIMESTAMP=$(date +'%Y%m%d%H%M%S')
        echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

        echo "IMAGE_TAG=$VERSION-SNAPSHOT-$TIMESTAMP" >> $GITHUB_ENV


    - name: Build Docker image
      run: |
        echo "Test output for ECR ${{ steps.login-ecr.outputs.registry }}"
        docker build -t ${{ vars.ECR_REPOSITORY_URL }}/${{ vars.ECR_REPOSITORY_GROUP }}/${{ vars.ECR_REPOSITORY_NAME }}:${IMAGE_TAG} .

    - name: Push Docker image to ECR
      run: |
        docker push ${{ vars.ECR_REPOSITORY_URL }}/${{ vars.ECR_REPOSITORY_GROUP }}/${{ vars.ECR_REPOSITORY_NAME }}:${IMAGE_TAG}


