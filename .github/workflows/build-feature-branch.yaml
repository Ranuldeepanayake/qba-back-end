name: Build feature/develop branch

on:
  #Execute on push and manually.
  #push:
    #Only build automatically if pushed to the specified branches.
    #branches: 
    #- '**'
    #- develop
    #- main
  workflow_dispatch:

env:
  VERSION_FILE: package.json

jobs:
  build-feature-branch:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION }}

    #Only needed to log in to private ECR repositories.
    # - name: Login to Amazon ECR
    #   id: login-ecr
    #   uses: aws-actions/amazon-ecr-login@v2

    - name: Login to AWS ECR
      run: |
        aws ecr-public get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REPOSITORY_URL }}

      
    - name: Prepare image tag with version number and timestamp
      id: meta
      run: | 
        #Read the version file.
        VERSION=$(jq -r '.version' ${VERSION_FILE} | tr -d '\n')

        #If node is installed in the environment.
        #VERSION=$(node -p "require('./package.json').version") 
        
        #Append the version number variable to the array of runtime variables.
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version number: ${VERSION}"

        #Append the time stamp variable to the array of runtime variables.
        TIMESTAMP=$(date +'%Y%m%d%H%M%S')
        echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

        #Append the image digest.
        #SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

        #Append the final tag to the array of runtime variables.
        echo "IMAGE_TAG=$VERSION-SNAPSHOT-$TIMESTAMP" >> $GITHUB_ENV
        echo "${IMAGE_TAG}"


    - name: Build image image
      run: |
        echo "Image name: ${{ vars.ECR_REPOSITORY_URL }}/${{ vars.ECR_REPOSITORY_GROUP }}/${{ vars.ECR_REPOSITORY_NAME }}:${IMAGE_TAG}"
        docker build -t ${{ vars.ECR_REPOSITORY_URL }}/${{ vars.ECR_REPOSITORY_GROUP }}/${{ vars.ECR_REPOSITORY_NAME }}:${IMAGE_TAG} .

    
    - name: Push image to ECR
      run: |
        docker push ${{ vars.ECR_REPOSITORY_URL }}/${{ vars.ECR_REPOSITORY_GROUP }}/${{ vars.ECR_REPOSITORY_NAME }}:${IMAGE_TAG}


