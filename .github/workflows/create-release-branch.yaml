#Create a new release branch from the develop branch and increment the version number of the develop branch.

name: Create release branch

on:
  workflow_dispatch:
    inputs:
      #Input to select the action.
      INPUT_ACTION:
        description: 'Select action'
        required: true
        default: build
        # GitHub doesn't have native radio buttons; use allowed values
        type: choice
        options:
          - build
          - build-and-deploy

      #Input to select the version number segment to bump.
      INPUT_BUMP_SEGMENT:
        description: 'Select version segment to bump'
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

#########
# - name: Deploy to environment
#   if: ${{ github.event.inputs.environment == 'prod' }}
#   run: echo "Deploying to production"

# if: github.ref == 'refs/heads/develop'

# on:
